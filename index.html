  <style>
    :root {
      --bg: #FAFAF9; --fg: #18181B; --muted: #71717A; --faint: #A1A1AA;
      --line: #E4E4E7; --accent: #2563EB; --chip: #F4F4F5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F0F11; --fg: #F4F4F5; --muted: #A1A1AA; --faint: #71717A;
        --line: #27272A; --accent: #60A5FA; --chip: #1C1C1F;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 640px; margin: 0 auto; padding: 96px 20px 64px; }
    a { color: inherit; }

    header h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -.02em; margin: 0; }

    .contact { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; padding: 0; list-style: none; }
    .contact a {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px; background: var(--chip);
      border: 1px solid var(--line); font-size: .875rem; text-decoration: none;
      color: var(--muted); transition: color .15s, border-color .15s;
    }
    .contact a:hover, .contact a:focus-visible { color: var(--fg); border-color: var(--faint); }
    .contact svg { width: 16px; height: 16px; flex: none; fill: currentColor; }

    h2 {
      font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
      color: var(--faint); margin: 64px 0 8px;
    }
    .projects { list-style: none; margin: 0; padding: 0; }
    .projects li { padding: 20px 0; border-top: 1px solid var(--line); }
    .projects li:last-child { border-bottom: 1px solid var(--line); }
    .projects h3 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .projects h3 a { text-decoration: none; }
    .projects h3 a:hover, .projects h3 a:focus-visible { color: var(--accent); }
    .projects p { margin: 4px 0 10px; color: var(--muted); font-size: .95rem; }
    .projects .links { display: flex; gap: 16px; font-size: .875rem; }
    .projects .links a { color: var(--accent); text-decoration: none; }
    .projects .links a:hover { text-decoration: underline; }
